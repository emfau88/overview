<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d9d3c8">
  <title>emfau · Projektkompass</title>
  <meta name="description" content="Zentrale Arbeitsgrundlage für emfau: Ziele, Produkte, ausführliche Analysen, Quellen und nächste Schritte.">
  <script>
    (function () {
      var remembered = null;
      try { remembered = localStorage.getItem('overview-theme'); } catch (_) {}
      var theme = remembered === 'dark' || remembered === 'light' ? remembered :
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#181818' : '#d9d3c8';
    }());
  </script>
  <style>/* DASHBOARD_STYLES */</style>
</head>
<body>
  <a class="skip" href="#content">Zum Inhalt</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <a class="brand" href="#overview"><span class="brand-mark">e.</span><span><strong>emfau</strong><small>PROJEKTKOMPASS</small></span></a>
      <div class="sidebar-label">Arbeitsgrundlage</div>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom"><span class="live-dot"></span> Ein gemeinsamer Stand<small id="sidebar-date"></small><a href="https://github.com/emfau88/overview" target="_blank" rel="noopener noreferrer">Repository öffnen ↗</a></div>
    </aside>
    <main id="content" tabindex="-1">
      <header class="topbar"><span id="breadcrumb">Kompaktübersicht</span><div class="top-actions"><span id="stamp" class="stamp"></span><button id="theme-toggle" class="button small theme-toggle" type="button" aria-label="Dunkelmodus" aria-pressed="false" title="Zwischen gedämpftem hellem Design und anthrazitfarbenem Dunkelmodus wechseln"><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.3 14.5A8.5 8.5 0 0 1 9.5 3.7a8.5 8.5 0 1 0 10.8 10.8Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg><span class="theme-label">Dunkelmodus</span></button><button id="export" class="button small" title="Alle Daten und vollständigen Dokumente als JSON herunterladen">Snapshot exportieren</button></div></header>
      <div id="page"></div>
      <footer>Dokumentierter Arbeitsstand · Inhalte und Quellen werden mit jeder Analyse fortgeschrieben.<span> em<span class="muted">fau</span> / overview</span></footer>
    </main>
  </div>
  <dialog id="project-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      var toggle = document.getElementById('theme-toggle');
      var root = document.documentElement;
      var preference = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      var explicitlyChosen = false;
      try { explicitlyChosen = ['dark', 'light'].indexOf(localStorage.getItem('overview-theme')) !== -1; } catch (_) {}
      function applyTheme(theme) {
        root.dataset.theme = theme;
        toggle.setAttribute('aria-pressed', String(theme === 'dark'));
        toggle.title = theme === 'dark' ? 'Dunkelmodus (Anthrazit) eingeschaltet – zum hellen Design wechseln' : 'Dunkelmodus in Anthrazit einschalten';
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#181818' : '#d9d3c8';
      }
      applyTheme(root.dataset.theme);
      toggle.addEventListener('click', function () {
        var theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        explicitlyChosen = true;
        try { localStorage.setItem('overview-theme', theme); } catch (_) {}
        applyTheme(theme);
      });
      if (preference && preference.addEventListener) {
        preference.addEventListener('change', function (event) {
          if (!explicitlyChosen) applyTheme(event.matches ? 'dark' : 'light');
        });
      }
    }());
  </script>
  <script id="dashboard-data" type="application/json">/* DASHBOARD_DATA */</script>
  <script>/* DASHBOARD_APP */</script>
</body>
</html>
